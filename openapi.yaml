components:
  schemas:
    http.LockStatusResponse:
      properties:
        expiresAt:
          format: date-time
          type: string
        locked:
          type: boolean
      required:
        - locked
      type: object
    http.TokenIssuanceResponse:
      properties:
        accessToken:
          type: string
        accessTokenTTL:
          type: integer
        editorUrl:
          type: string
        wopiSrc:
          type: string
      required:
        - accessToken
        - accessTokenTTL
        - wopiSrc
        - editorUrl
      type: object
    http.healthResponse:
      properties:
        collabora:
          type: string
        collabora_last_success:
          format: date-time
          type: string
        status:
          type: string
      required:
        - status
      type: object
    http.tokenRequest:
      properties:
        actorName:
          type: string
        documentId:
          type: string
        lang:
          type: string
      required:
        - documentId
      type: object
info:
  contact:
    email: info@alkem.io
    name: Alkemio Foundation
    url: https://alkem.io
  description: |
    WOPI protocol host service for Collabora Online integration into
    the Alkemio platform. Provides token issuance, document editing
    (CheckFileInfo, GetFile, PutFile), locking, and WOPI discovery.
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2
  title: Alkemio WOPI Service
  version: 1.1.0
openapi: 3.1.1
paths:
  /live:
    post:
      operationId: http.LiveHandler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.healthResponse'
          description: OK
      summary: LiveHandler handles the /live endpoint (process-local, no dependency checks).
  /wopi/files/{fileID}:
    get:
      operationId: WOPIHandler.CheckFileInfo
      parameters:
        - in: path
          name: fileID
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
          description: Default response (no response found)
      summary: CheckFileInfo handles GET /wopi/files/{fileID}.
    post:
      operationId: WOPIHandler.FileOperation
      parameters:
        - in: path
          name: fileID
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
          description: Default response (no response found)
      summary: FileOperation handles POST /wopi/files/{fileID} — dispatches on X-WOPI-Override.
  /wopi/files/{fileID}/contents:
    get:
      operationId: WOPIHandler.GetFile
      parameters:
        - in: path
          name: fileID
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
          description: Default response (no response found)
      summary: GetFile handles GET /wopi/files/{fileID}/contents.
    post:
      operationId: WOPIHandler.PutFileContents
      parameters:
        - in: path
          name: fileID
          required: true
          schema:
            type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: object
          description: Default response (no response found)
      summary: PutFileContents handles POST /wopi/files/{fileID}/contents.
  /wopi/files/{fileID}/lock-status:
    get:
      description: |-
        LockStatus handles GET /wopi/files/{fileID}/lock-status. It reports whether the
        document currently has an active (non-expired) WOPI lock, so callers outside the
        Collabora flow — notably alkemio-server's replace-file guard — can refuse a
        backing-file swap while the document is being edited. Read-only; the route is
        gated by the server-trusted actor header (not a WOPI access token, since this is
        not a Collabora callback).
      operationId: WOPIHandler.LockStatus
      parameters:
        - in: path
          name: fileID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.LockStatusResponse'
          description: OK
        "400":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Internal Server Error
      summary: LockStatus handles GET /wopi/files/{fileID}/lock-status.
  /wopi/token:
    post:
      operationId: TokenHandler.ServeHTTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.tokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.TokenIssuanceResponse'
          description: OK
        "400":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Not Found
        "405":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Method Not Allowed
        "422":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Unprocessable Entity
        "500":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
          description: Service Unavailable
      summary: ServeHTTP handles POST /wopi/token.
